<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SashaFit</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Тема: чорний + помаранчевий */
  --paper:#0B0B0C; --surface:#161617; --ink:#F5F1EA; --muted:#A39C92; --line:#2C2C2E;
  --accent:#FF7A1A; --accent-ink:#140B03; --accent-soft:#2E1B0B;
  --warn:#F0C24B; --warn-soft:#2D2610; --bad:#FF6B7A; --bad-soft:#3B171C; --good:#5FD38D; --good-soft:#12301F;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .sm{font-size:13px} .grow{flex:1;min-width:0}
.wrap{max-width:560px;margin:0 auto;padding:0 0 96px}
.center{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.center .box{max-width:380px}
.center h1{font:700 22px/1.25 'Unbounded',system-ui,sans-serif;letter-spacing:-.02em;margin-bottom:10px}
.demo{background:var(--warn-soft);color:var(--warn);font-size:13px;text-align:center;padding:6px 10px}
.demo a{color:inherit;font-weight:600}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* shared */
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:13px 18px;border-radius:12px;font-weight:600;cursor:pointer;width:100%;min-height:44px}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;min-height:38px}
.btn.alt{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.plain{background:var(--paper);color:var(--muted)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{resize:vertical;min-height:76px}
.unit{position:relative;display:block}
.unit input{padding-right:46px}
.unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.field{display:block;margin-top:14px}
.field>span:first-child{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
.lbl{display:block;font-size:14px;font-weight:500;margin:14px 0 6px}
.callout{background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin-top:14px}
.callout b{color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;min-height:38px}
.opts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.inline select{flex:1 1 180px;width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--paper);border-radius:14px;padding:12px 14px}
.stat b{display:block;font:700 19px 'Unbounded',system-ui,sans-serif;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.bar-row{margin-top:10px}
.bar-l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar i.over{background:var(--bad)}
.hist{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.hist.btn-like{cursor:pointer}
.subrows{padding:0 0 8px 0;font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.sec{margin-top:20px}
.sec h3{font-size:16px;font-weight:600;margin-bottom:10px}
svg text{fill:var(--muted);font-family:'Onest',system-ui,sans-serif}

/* header and tabs */
.ph-head{padding:calc(18px + env(safe-area-inset-top,0px)) 20px 6px}
.hello{font:700 24px/1.2 'Unbounded',system-ui,sans-serif;letter-spacing:-.02em;margin:2px 0 10px}
.ph-body{padding:10px 20px 26px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs button{border:0;background:none;padding:10px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer;min-height:56px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabs svg,.tick svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.prog-title{font-weight:600;font-size:17px}
.big{font:700 52px/1 'Unbounded',system-ui,sans-serif;letter-spacing:-.03em;margin-top:14px}
.big small{font-size:20px;color:var(--muted);font-weight:500;letter-spacing:0}
.segs{display:flex;gap:4px;margin:14px 0 6px}
.segs i{flex:1;height:10px;border-radius:3px;background:var(--line)}
.segs i.on{background:var(--accent)}
.ex{border-top:1px solid var(--line);padding:14px 0 8px;margin-top:14px}
.ex h3{font-size:16px;font-weight:600}
.set{display:grid;grid-template-columns:20px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:8px}
.setn{color:var(--muted);font-size:13px;text-align:center}
.tick{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:18px;height:18px;stroke:transparent}
.tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.tick[aria-pressed="true"] svg{stroke:var(--accent-ink)}
.meal{border-top:1px solid var(--line);padding:14px 0}
.meal h3{font-size:16px;font-weight:600}
.ent{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);margin-top:8px}
.x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:6px 10px;min-height:38px}
.addp{background:var(--paper);border-radius:14px;padding:12px;margin-top:10px;display:grid;gap:10px}
.addp input,.addp textarea{background:var(--surface)}
.res{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;cursor:pointer}
.res:last-child{border-bottom:0}
.ghost{border:1px solid var(--line);background:none;border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
.mood{display:flex;gap:6px}
.mood button{flex:1;padding:10px 0;border:1px solid var(--line);border-radius:10px;background:none;cursor:pointer;min-height:44px}
.mood button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.photos,.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos button,.shots div{aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:12px;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:6px;overflow:hidden;display:grid;place-items:center;position:relative}
.photos button[aria-pressed="true"]{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.shots div{border:1px solid var(--line);cursor:default;background:var(--paper)}
.photos img,.shots img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.datebar button{border:1px solid var(--line);background:none;border-radius:10px;width:44px;height:44px;cursor:pointer;font-size:18px}

/* coach */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.card h2{font-size:17px;font-weight:600;margin-bottom:4px}
.c-title{font:700 24px/1.2 'Unbounded',system-ui,sans-serif;letter-spacing:-.02em}
.att{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.good{background:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 4px;cursor:pointer;min-height:56px}
.row:last-child{border-bottom:0}
.sw-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw-row:last-child{border-bottom:0}
.sw{width:46px;height:26px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.wk{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.itrow{display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:8px;align-items:center;margin-top:8px}
.itrow select{grid-column:1/-1}
.itrow .mv{display:flex;gap:2px;grid-column:4}
.exrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.invite{word-break:break-all;background:var(--paper);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:8px}
.back{border:0;background:none;color:var(--accent);padding:10px 0;cursor:pointer;font-weight:500;min-height:44px}
.saved{font-size:13px;color:var(--muted)}

.exhead{display:flex;gap:12px;align-items:flex-start}
.exthumb{width:76px;height:76px;border-radius:12px;object-fit:cover;background:var(--paper);border:1px solid var(--line);cursor:zoom-in;flex:none}
.exthumb.s{width:48px;height:48px;border-radius:10px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:grid;place-items:center;z-index:60;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=10"></script>
<script src="demo.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
